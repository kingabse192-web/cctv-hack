[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "absearch"
version = "1.1.0"
description = "Authorized local-network and CCTV inventory with a clean offline dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AB Search contributors" }]
keywords = ["network", "inventory", "cctv", "security", "lan", "bluetooth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
bluetooth = ["bleak>=0.22"]
ui = ["rich>=13"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
absearch = "absearch.cli:main"

[project.urls]
Homepage = "https://github.com/kingabse192-web/cctv-hack"

[tool.setuptools]
packages = ["absearch"]

[tool.setuptools.package-data]
absearch = ["web/template.html", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
